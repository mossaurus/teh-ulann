<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Pengumuman</title>

    <!-- framework -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!-- <script
      src="https://kit.fontawesome.com/YOUR_KIT_CODE.js"
      crossorigin="anonymous"
    ></script> -->

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <!-- css -->
    <link rel="stylesheet" href="../css/login.css" />
  </head>

  <body>
    <!-- login section -->

    <div class="login-page">

    <div class="text-center hero">
        <h1>Portal Pengumuman</h1>
        <p>Masukkan data untuk membuka informasi.</p>
    </div>

    <div class="login-card">

        <label>Nama Lengkap</label>

        <input
            type="text"
            placeholder="Fahri Salman"
            id="nama">

        <label>Tanggal Lahir</label>

        <div class="birth-group">

            <input
                type="text"
                placeholder="03"
                id="tanggal">

            <input
                type="text"
                placeholder="12"
                id="bulan">

            <input
                type="text"
                placeholder="2006"
                id="tahun">

        </div>
        <div class="message">
          <div class="note">
            Contoh format:
            Fahri Salman | 03 | 12 | 2006
          </div>
          <div id="errorMessage"></div>
        </div>


        <div class="button-area">

            <button id="loginButton">
                Buka Hasil
            </button>

        </div>

    </div>

</div>
    
    <!-- js -->
    <script src="../js/login.js"></script>
  </body>
</html>
