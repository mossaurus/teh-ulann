<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- framework -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!-- <script
      src="https://kit.fontawesome.com/YOUR_KIT_CODE.js"
      crossorigin="anonymous"
    ></script> -->

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <!-- css -->
    <link rel="stylesheet" href="/css/countdown.css" />
  </head>

  <body>
    <!-- countdown section -->

    <div id="countdown" class="countdown">
      <div class="container">
        <div class="text-center hero">
          <h1>Portal Pengumuman</h1>
          <p>Informasi akan dibuka sesuai waktu yang ditentukan</p>
        </div>

        <div class="countdown-card">
          <div class="countdown-top">
            <div class="countdown-wrapper">
              <div class="time-box">
                <p>Hari</p>
                <h2 id="days" class="countdown-number">00</h2>
              </div>

              <div class="separator">:</div>

              <div class="time-box">
                <p>Jam</p>
                <h2 id="hours" class="countdown-number">00</h2>
              </div>

              <div class="separator">:</div>

              <div class="time-box">
                <p>Menit</p>
                <h2 id="minutes" class="countdown-number">00</h2>
              </div>

              <div class="separator">:</div>

              <div class="time-box">
                <p>Detik</p>
                <h2 id="seconds" class="countdown-number">00</h2>
              </div>
            </div>
          </div>

          <div class="countdown-bottom">
            <h5>Mohon buka informasi sesuai waktu yang ditentukan.</h5>

            <p>Silakan tunggu sampai portal terbuka.</p>

            <div class="d-flex justify-content-between mt-4">
              <button class="btn btn-danger btn-lg">Reminder Me</button>

              <button
                id="resultButton"
                class="btn btn-secondary btn-lg"
                disabled>
                Buka Hasil
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- js -->
    <script src="/js/countdown.js"></script>
  </body>
</html>
